# Deployment compose: runs the prebuilt image from GHCR, no source checkout needed.
# Usage: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Pin a release with CORDTRAIL_TAG in .env (default: latest).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" -q ''SELECT 1''',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    image: ghcr.io/uni0305/cordtrail:${CORDTRAIL_TAG:-latest}
    env_file: .env
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  clickhouse-data:
