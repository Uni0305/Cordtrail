[versions]
kotlin = "2.4.21"

[libraries]
clickhouse-client = { module = "com.clickhouse:client-v2", version = "0.11.1" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.23.0" }
jda = { module = "net.dv8tion:JDA", version = "6.7.0" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.6.6" }
mockk = { module = "io.mockk:mockk", version = "1.14.12" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.20" }

[bundles]
logging = ["slf4j-api", "logback-classic"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.11" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
